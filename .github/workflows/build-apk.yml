name: Build PE Control Training TV V2 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V2 Android project
        run: |
          unzip -q PE-Control-Training-V2.zip
          echo "Extracted project:"
          find PEControlTrainingV2 -maxdepth 4 -type f | sort

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build V2 APK
        working-directory: PEControlTrainingV2
        run: gradle assembleDebug --no-daemon

      - name: Check APK
        run: |
          ls -lh PEControlTrainingV2/app/build/outputs/apk/debug/
          file PEControlTrainingV2/app/build/outputs/apk/debug/*.apk

      - name: Upload V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: PE-Control-Training-TV-V2-APK
          path: PEControlTrainingV2/app/build/outputs/apk/debug/*.apk
